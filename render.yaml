services:
  # API Server
  - type: web
    name: aram-tracker-api
    env: node
    plan: free
    buildCommand: "cd server && npm install"
    startCommand: "cd server && node index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: 3306
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: RIOT_API_KEY
        sync: false

databases:
  # MySQL Database
  - name: aram-tracker-db
    plan: free
    databaseName: aram_tracker
    user: aram_user
